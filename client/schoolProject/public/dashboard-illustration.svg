  <circle cx="392" cy="70" r="6" fill="#ffe1c2" />
  <circle cx="392" cy="106" r="6" fill="#ffe1c2" />
  <line x1="360" y1="86" x2="392" y2="70" stroke="#ffffff" stroke-width="2" opacity="0.7" />
  <line x1="360" y1="86" x2="392" y2="106" stroke="#ffffff" stroke-width="2" opacity="0.7" />

  <!-- Sparkle accents -->
  <circle cx="120" cy="80" r="5" fill="#ffffff" opacity="0.85" />
  <circle cx="150" cy="60" r="3" fill="#ffe1c2" />
  <circle cx="420" cy="180" r="4" fill="#ffffff" opacity="0.7" />
  <circle cx="60" cy="150" r="3" fill="#ffffff" opacity="0.6" />
