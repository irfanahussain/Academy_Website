<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 360">
  <!-- Desk -->
  <rect x="40" y="290" width="400" height="16" rx="6" fill="rgba(255,255,255,0.22)" />
  <rect x="70" y="306" width="16" height="40" fill="rgba(255,255,255,0.18)" />
  <rect x="394" y="306" width="16" height="40" fill="rgba(255,255,255,0.18)" />

  <!-- Books stack -->
  <rect x="330" y="250" width="90" height="16" rx="4" fill="#fff" opacity="0.9" />
  <rect x="336" y="234" width="78" height="16" rx="4" fill="#ffe1c2" />
  <rect x="342" y="218" width="66" height="16" rx="4" fill="#0b0b0e" />

  <!-- Plant -->
  <rect x="60" y="256" width="34" height="34" rx="6" fill="#0b0b0e" />
  <circle cx="77" cy="240" r="10" fill="#7fbf8f" />
  <circle cx="66" cy="248" r="8" fill="#8fd19e" />
  <circle cx="90" cy="248" r="8" fill="#8fd19e" />

  <!-- Laptop -->
  <rect x="150" y="248" width="120" height="8" rx="3" fill="#0b0b0e" />
  <path d="M158 248 L168 190 L252 190 L262 248 Z" fill="#ffffff" opacity="0.95" />
  <path d="M168 196 L252 196 L260 242 L160 242 Z" fill="#0b0b0e" />

