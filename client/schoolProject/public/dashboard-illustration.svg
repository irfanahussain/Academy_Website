  <circle cx="220" cy="118" r="34" fill="#f3c89a" />
  <path d="M186 116 a34 34 0 0 1 68 0 c0 -14 -10 -30 -34 -30 s-34 16 -34 30 Z" fill="#2a1b10" />
  <path d="M186 118 c-4 30 4 52 4 52 l10 -6 c-4 -18 -4 -34 -4 -34 Z" fill="#2a1b10" />

  <!-- Molecule / science accent, top right -->
